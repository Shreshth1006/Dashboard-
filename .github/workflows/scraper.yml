name: Instagram Scraper
on:
  schedule:
    # Every 1 hour from 8am to 7pm IST (2:30am - 1:30pm UTC)
    - cron: '30 2 * * *'   # 8:00am IST
    - cron: '30 3 * * *'   # 9:00am IST
    - cron: '30 4 * * *'   # 10:00am IST
    - cron: '30 5 * * *'   # 11:00am IST
    - cron: '30 6 * * *'   # 12:00pm IST
    - cron: '30 7 * * *'   # 1:00pm IST
    - cron: '30 8 * * *'   # 2:00pm IST
    - cron: '30 9 * * *'   # 3:00pm IST
    - cron: '30 10 * * *'  # 4:00pm IST
    - cron: '30 11 * * *'  # 5:00pm IST
    - cron: '30 12 * * *'  # 6:00pm IST
    - cron: '30 13 * * *'  # 7:00pm IST
    # Every 2 hours after 7pm IST (1:30pm UTC onwards)
    - cron: '30 15 * * *'  # 9:00pm IST
    - cron: '30 17 * * *'  # 11:00pm IST
    - cron: '30 19 * * *'  # 1:00am IST (next day)
    - cron: '30 21 * * *'  # 3:00am IST (next day)
    - cron: '30 23 * * *'  # 5:00am IST (next day)
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir
      - name: Run scraper
        env:
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python supa.py